name: Tests
# Runs every code test and the website checks on GitHub (where all libraries install), after each change and by hand.
on:
  push:
    branches: [main]
    paths: ["trading/**", "pipeline/**", "web/index.html", "web/tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install -q -r trading/requirements.txt -r pipeline/requirements.txt
      - name: Python tests
        working-directory: trading
        run: python -m unittest discover tests
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Website checks
        run: node web/tests/genie_matrix.js
