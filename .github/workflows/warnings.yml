name: Live screener
on:
  # No schedule since 24 Nov 2026: market_loop.yml runs the screener every 10 minutes from 09:15. Kept for manual runs.
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pywebpush requests pandas
      - name: Rank on live prices, alert and push
        working-directory: pipeline
        run: python live_screen.py ../web/picks.json ../web/history.json
      - name: Commit new ideas
        run: |
          git config user.name "trendlens-bot"
          git config user.email "trendlens-bot@users.noreply.github.com"
          git add web/picks.json
          git diff --cached --quiet || (git commit -m "Live alerts $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
