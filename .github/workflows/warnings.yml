name: Price warnings
on:
  schedule:
    # Every 10 minutes while NSE is open (09:15-15:30 IST), Mon-Fri
    - cron: "45,55 3 * * 1-5"
    - cron: "*/10 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: warnings
  cancel-in-progress: true
jobs:
  warn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pywebpush requests
      - run: python pipeline/warnings_push.py web/picks.json
