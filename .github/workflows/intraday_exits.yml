name: Exhaustion fade - exit rules (choose on 2014-2021, check on 2022-2026)
# Run by hand (pipeline/intraday_exit_test.py). Uses saved 5-minute data; no secrets.
on:
  workflow_dispatch:
    inputs:
      hist_run:
        description: "run ID with history-5min-data (2014-2021)"
        required: true
        default: "45143637613"
      new_run:
        description: "run ID with hf-5min-data (2022-2026)"
        required: true
        default: "45141143038"
permissions:
  contents: read
  actions: read
jobs:
  exits:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pandas numpy requests
      - uses: actions/download-artifact@v4
        with: { name: history-5min-data, path: hist_data, run-id: "${{ github.event.inputs.hist_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: hf-5min-data, path: new_data, run-id: "${{ github.event.inputs.new_run }}", github-token: "${{ github.token }}" }
      - name: Exit test
        env: { PYTHONUNBUFFERED: "1" }
        run: python pipeline/intraday_exit_test.py --old hist_data --new new_data --out exit_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-results
          path: exit_results
          retention-days: 30
