name: Daily data
on:
  schedule:
    # 08:45 IST pre-market (03:15 UTC) and 15:45 IST after the close (10:15 UTC), Mon-Fri
    - cron: "15 3 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Refresh prices, universe and history
        working-directory: pipeline
        run: python update_picks.py ../web/picks.json ../web/history.json
      - name: Refresh fundamentals (pre-market run and manual runs only)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 3 * * 1-5'
        working-directory: pipeline
        continue-on-error: true
        run: python fundamentals.py ../web/history.json ../web/fundamentals.json
      - name: Commit
        run: |
          git config user.name "trendlens-bot"
          git config user.email "trendlens-bot@users.noreply.github.com"
          git add web/picks.json web/history.json web/fundamentals.json 2>/dev/null || git add web/picks.json web/history.json
          git diff --cached --quiet || (git commit -m "Daily data $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
