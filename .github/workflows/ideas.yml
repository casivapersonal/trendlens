name: Trade ideas
on:
  schedule:
    - cron: "45 10 * * 1-5"      # 16:15 IST, after the close and after the 15:45 data refresh: flag exits, then scan for proposals
  workflow_dispatch:
    inputs:
      action:
        description: "scan (CEO chooses; ideas are posted at the next open) | open (post scheduled ideas if the 9:30 price is in range, test) | monitor (CEO closes) | pending | approve | reject | close (manual overrides)"
        required: true
        default: "monitor"
      target:
        description: "idea id (approve / reject) or id / symbol (close)"
        required: false
      reason:
        description: "close reason, e.g. Target hit, Stop-loss hit, Time up, Momentum rank fell (blank = the flagged exit signal, else Closed by decision-maker)"
        required: false
      price:
        description: "close price (blank = the flagged signal price, else the last price)"
        required: false
      by:
        description: "decision-maker name"
        required: false
      force:
        description: "true = run even on a holiday/weekend or during market hours (scan), or approve despite a BLOCK"
        required: false
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r trading/requirements.txt -r pipeline/requirements.txt pywebpush
      - name: Make sure today's closing data is in (the daily data job can run late)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.action == 'scan' }}
        working-directory: pipeline
        run: |
          python - <<'PY'
          import json, subprocess, sys, datetime as dt
          today = (dt.datetime.utcnow() + dt.timedelta(hours=5, minutes=30)).date().isoformat()
          h = json.load(open("../web/history.json"))
          if h["dates"][-1] != today:
              print("history.json ends", h["dates"][-1], "- refreshing for", today)
              subprocess.run([sys.executable, "update_picks.py", "../web/picks.json", "../web/history.json"], check=True)
          PY
      - name: Run
        working-directory: trading
        env:
          ACT: ${{ github.event.inputs.action || 'scan' }}
          TGT: ${{ github.event.inputs.target }}
          RSN: ${{ github.event.inputs.reason }}
          PRC: ${{ github.event.inputs.price }}
          BY: ${{ github.event.inputs.by }}
          FRC: ${{ github.event.inputs.force }}
          EVT: ${{ github.event_name }}
        run: |
          set -e
          args=(ideas "$ACT")
          [ -n "$TGT" ] && args+=("$TGT")
          [ -n "$RSN" ] && args+=(--reason "$RSN")
          [ -n "$PRC" ] && args+=(--price "$PRC")
          [ -n "$BY" ] && args+=(--by "$BY")
          [ "$FRC" = "true" ] && args+=(--force)
          if [ "$ACT" = "scan" ] && [ "$EVT" = "schedule" ]; then python -m arena ideas monitor; fi
          python -m arena "${args[@]}"
      - name: Intraday segment - conditional ideas for the next session (exhaustion fade)
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.action == 'scan') }}   # runs even if the momentum scan failed
        continue-on-error: true
        working-directory: trading
        run: python -m arena intraday prep
      - name: Notify subscribers (ideas posted or closed today)
        if: ${{ always() && env.VAPID_PRIVATE_KEY != '' && env.UPSTASH_REDIS_REST_URL != '' }}
        continue-on-error: true
        working-directory: pipeline
        run: python notify.py ../web/picks.json
      - name: Commit
        if: ${{ always() }}
        run: |
          git config user.name "trendlens-bot"; git config user.email "trendlens-bot@users.noreply.github.com"
          for f in web/picks.json web/history.json trading/ideas/pending.json trading/ideas/intraday_watch.json nse/fno.csv; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Ideas $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
