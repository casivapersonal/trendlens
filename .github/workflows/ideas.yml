name: Trade ideas
on:
  schedule:
    - cron: "45 10 * * 1-5"      # 16:15 IST, after the close and after the 15:45 data refresh: flag exits, then scan for proposals
  workflow_dispatch:
    inputs:
      action:
        description: "scan | pending | monitor | approve | reject | close"
        required: true
        default: "monitor"
      target:
        description: "idea id (approve / reject) or id / symbol (close)"
        required: false
      reason:
        description: "close reason, e.g. Target hit, Stop-loss hit, Time up, Momentum rank fell (blank = the flagged exit signal, else Closed by decision-maker)"
        required: false
      price:
        description: "close price (blank = the flagged signal price, else the last price)"
        required: false
      by:
        description: "decision-maker name"
        required: false
      force:
        description: "approve only: true = approve even though the risk check says BLOCK"
        required: false
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r trading/requirements.txt pywebpush
      - name: Run
        working-directory: trading
        env:
          ACT: ${{ github.event.inputs.action || 'scan' }}
          TGT: ${{ github.event.inputs.target }}
          RSN: ${{ github.event.inputs.reason }}
          PRC: ${{ github.event.inputs.price }}
          BY: ${{ github.event.inputs.by }}
          FRC: ${{ github.event.inputs.force }}
          EVT: ${{ github.event_name }}
        run: |
          set -e
          args=(ideas "$ACT")
          [ -n "$TGT" ] && args+=("$TGT")
          [ -n "$RSN" ] && args+=(--reason "$RSN")
          [ -n "$PRC" ] && args+=(--price "$PRC")
          [ -n "$BY" ] && args+=(--by "$BY")
          [ "$FRC" = "true" ] && args+=(--force)
          if [ "$ACT" = "scan" ] && [ "$EVT" = "schedule" ]; then python -m arena ideas monitor; fi
          python -m arena "${args[@]}"
      - name: Notify subscribers (ideas posted or closed today)
        if: ${{ env.VAPID_PRIVATE_KEY != '' && env.UPSTASH_REDIS_REST_URL != '' }}
        continue-on-error: true
        working-directory: pipeline
        run: python notify.py ../web/picks.json
      - name: Commit
        run: |
          git config user.name "trendlens-bot"; git config user.email "trendlens-bot@users.noreply.github.com"
          git add web/picks.json trading/ideas/pending.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Ideas $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
