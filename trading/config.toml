# Breaking Money AI Trading Arena: configuration
# Everything is simulated. There is no setting that enables real orders.

[account]
# Used ONLY by the old paper-trading arena (`python -m arena run`, switched off in TrendLens). Ideas use no capital or position size.
starting_capital = 100000      # virtual rupees
challenge_days = 15            # the run stops after this many trading days

[market]
# Live price source: "yahoo" (no signup) or "upstox" (free API, needs your Upstox login)
feed = "yahoo"
# "static" = trade the watchlist below. "scan" = scan the whole universe each morning, trade a short list of the strongest.
watchlist_mode = "scan"
watchlist = ["RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "SBIN", "BHARTIARTL", "ITC", "LT", "AXISBANK"]
# NSE trading holidays (YYYY-MM-DD). Weekends are skipped automatically.
# Copy the current list from the NSE website before you start a challenge.
holidays = []

[strategy]
# "balanced" uses the numbers below. "aggressive" = up to 3 concentrated positions of 35% each, 6% daily loss
# limit, and only A+ momentum breakouts with quick profit-taking (it overrides the matching settings below).
profile = "balanced"
# Who makes the calls: "auto" picks your Claude Code login if installed, else an API key, else the free rules strategy.
# Or force one: "claude-cli", "claude-api", "rules"
brain = "auto"
model = "claude-opus-5-5"      # used by claude-api
effort = "medium"              # low | medium | high: how hard Claude thinks per decision
cli_model = ""                 # optional --model for claude-cli
decision_minutes = 15          # Claude is asked for calls this often
poll_seconds = 30              # prices are checked this often (stops/targets run on every poll)
bar_minutes = 5                # candle size used for indicators
product = "intraday"           # "intraday" = auto square-off every day; "delivery" = may hold overnight
square_off_time = "15:15"
no_new_entries_after = "14:45"
max_positions = 5
max_position_pct = 20          # max % of equity in one stock
default_stop_loss_pct = 1.5    # used only by the real-time arena engine, which is switched OFF in TrendLens. Intraday ideas use [intraday]
default_target_pct = 3.0       # (back-test Nov 2026: fixed % exits mostly killed the intraday edge; 1 daily ATR stop + 2R target kept it)
max_daily_loss_pct = 3.0       # kill switch: close everything and stop entries for the day
# Free-text guidance passed to Claude. Use it to try different styles across the series.
notes = ""

[universe]
name = "nifty500"              # reads universe/nifty500.csv or pipeline/nifty500.txt; use "nifty1000" later
shortlist_size = 15            # stocks watched each decision cycle (Yahoo cannot serve hundreds of candle series every 15 minutes)
pool_size = 40                 # morning scan keeps this many; the short list is re-ranked from the pool on live strength
min_price = 20
min_avg_value_cr = 5           # 20-day average traded value, crore rupees

[risk]
# Used ONLY by the switched-off paper-trading arena. TrendLens ideas have no loss limit in rupees and no position sizing.
max_loss_pct = 3               # max loss per trade as % of the account (3% of Rs 1,00,000 = Rs 3,000), charges included; 0 = use max_loss_per_trade
max_loss_per_trade = 0         # optional fixed rupee limit, used only when max_loss_pct = 0
max_trades_per_day = 3         # 0 = off

[timemachine]
gate = false                   # true = refuse a BUY if the past sessions lost money after charges (slower: downloads 60 days of bars)
replays = 2000

[committee]
enabled = true                 # analysts' memo (technical, fundamentals, news, macro, risk officer) is added to Claude's context
# Only the risk officer can block a trade. The other analysts are evidence, not rules: they have no back-test.

[execution]
spread_bps = 4                 # assumed bid-ask spread; we cross half of it
slippage_bps = 3               # extra adverse slippage per order
impact_bps_per_pct_of_volume = 2   # extra cost per 1% of the bar's volume we take
max_participation = 0.05       # never fill more than 5% of a bar's volume
replay_latency_seconds = 60    # in replay, orders fill on the next bar after the decision

[charges]
# Indian equity charges. Check your broker's current schedule and update if rates change.
brokerage_intraday_pct = 0.03
brokerage_intraday_cap = 20.0
brokerage_delivery_pct = 0.0
brokerage_delivery_cap = 0.0
stt_intraday_sell_pct = 0.025
stt_delivery_pct = 0.1
exchange_txn_pct = 0.00297
sebi_per_crore = 10.0
stamp_intraday_buy_pct = 0.003
stamp_delivery_buy_pct = 0.015
gst_pct = 18.0
dp_charge_per_sell = 15.93

[report]
refresh_seconds = 60

[paths]
data_dir = "data"
db = "data/arena.db"
report = "reports/results.html"
log = "data/arena.log"

[safety]
paper_only = true              # cannot be changed; the program refuses to start otherwise

[ideas]
# Ideas are NOT trades. The coded judge scores a candidate, a human decision-maker approves it, and only then it is posted.
# It stays live until the decision-maker closes it (or you switch auto_close on). No real-time trading anywhere in this system.
max_live = 20                  # MOMENTUM slots (the back-test holds 20: enter at top 20, exit below #50). Setups have their own slots: [ceo] max_live_short
max_new_per_day = 4            # new SETUP ideas per day (momentum fills its free slots by rank, as in the back-test)
reentry_block = false          # audit fix #2, TESTED Nov 2026 and NOT adopted: blocking re-entry after a stop until the rank resets lowered CAGR (2011-19: 18.3% vs 20.4%; 2020-26: 44.0% vs 46.3%)
entry_rank = 20                # momentum rank that earns judge points (the original TrendLens entry rule)
exit_rank = 50                 # momentum ideas are FLAGGED when their rank falls below this; the decision-maker closes
approve_score = 6              # judge score for APPROVE (decision-maker still has the final say); starting point, not back-tested
watch_score = 4                # judge score for WATCH
max_atr_pct = 7                # too volatile for ATR-based levels above this daily ATR %
news_hard_reject = true        # serious headline flags (fraud, SEBI order, auditor resigns...) veto a SETUP idea; on a momentum idea they are a warning only (keyword hits are not confirmed facts)
setups = ["bull_flag"]         # setups that become ideas. Back-tested Nov 2026 after costs: bull flag +0.07R a trade (95% range +0.02 to +0.13, 2,588 trades); 20-day breakout -0.08R (dropped)
results_skip = true            # setup ideas are skipped when company results fall inside the holding period (needs nse/ results calendar)
entry_atr = 0.4                # entry range = close +/- this x ATR
short_days = 15                # trading days
short_stop_atr = 1.5
slippage_pct = 0.1             # per side, deducted on the Scorecard with Indian delivery charges
short_r = 2.5                  # target = r x stop distance
medium_days = 60
medium_stop_atr = 6            # safety stop from the actual entry price. Back-tested Nov 2026 (pipeline/backtest.py): about neutral (2011-19 20.4% vs 21.0% without; 2020-26 46.3% vs 45.2%); kept as crash protection
medium_r = 2.0                 # reference objective only (12 ATR, about the back-test's average winner); momentum ideas are NOT closed there
min_rr = 2.0                   # short-term ideas only
max_stop_pct_short = 12        # risk check: a short-term stop further than this is too wide
max_day_move = 0.35            # risk check: hold any signal after a one-day move above 35% (possible unadjusted split / bonus)
timemachine_points = 1         # judge points for / against the Time Machine verdict (needs 20+ past samples); evidence, not back-tested
timemachine_gate = false       # true = hard reject when past samples lost money after charges
auto_close = false             # false = exit signals are flagged and the decision-maker closes; true = closes at the signal price

[ceo]
# The CEO is the final decision-maker: after every scan it posts or declines each proposal, after every monitor it closes
# ideas with an exit signal. Every decision is written to trading/ideas/pending.json (ceo_log) and shown on the idea.
enabled = true                 # false = back to manual approve / close
max_per_sector = 3             # live ideas in one industry at once (e.g. Banks - Regional)
max_live_short = 4             # short-term setup ideas live at once: their OWN slots, never taken from the 20 momentum slots
max_per_broad_sector = 6       # live ideas in one broad sector (e.g. Financial Services). Momentum caps count momentum ideas only, in rank order (back-tested: helped)
ai_review = false              # true + ANTHROPIC_API_KEY secret = Claude takes a second look and may DECLINE (never post) an idea
model = ""                     # blank = claude-sonnet-5-5

[intraday]
# Intraday segment: the exhaustion fade (short), back-tested Nov 2026 on 2014-2026 five-minute data (see trading/TRENDLENS.md).
# Conditional ideas are published after the close for the next session; the scorecard uses the 9:20 candle's open.
enabled = true
gap_min = 1.5                  # opens at least this % above yesterday's close ...
gap_max = 8.0                  # ... and at most this % (bigger gaps are usually news or corporate actions)
ext50 = 0.25                   # setup: close > 25% above the 50-day average, or
ret5 = 0.20                    #        up > 20% in 5 sessions, or
use_breakout = true            #        a close at a 20-day high on 1.5x the 50-day average volume
stop_atr = 1.0                 # stop = entry + 1 x daily ATR(14)   (exit test: no other exit beat this on both periods)
target_r = 2.0                 # target = entry - 2 x the stop distance
entry_at = "09:20"             # entry at the open of this five-minute candle (late-entry test: the edge fades fast after 9:20)
square_off = "15:15"
max_per_day = 3                # biggest 5-day run-up first
min_price = 20
min_value_cr = 5               # 20-day average traded value, crore rupees
slippage_pct = 0.10            # per side, in the after-cost results
